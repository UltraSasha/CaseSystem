name: ${name}
version: '${version}'
main: ${main}
api-version: '1.19'
author: CaseSystemTeam
description: Case opening system with 3D animations, rarities, permissions and full config support (Paper 1.19.2 - 1.21.1).
softdepend:
  - ProtocolLib
  - PlaceholderAPI
  - LuckPerms

commands:
  cs:
    description: Open the CaseSystem GUI.
    aliases: [case, casesystem]

permissions:
  casesystem.admin:
    description: Access to admin subcommands (reload/give/list/debug).
    default: op
  casesystem.case.open:
    description: Base node; actual grants look like casesystem.case.open.<case_id>.<amount>.
    default: false
